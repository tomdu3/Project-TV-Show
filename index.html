<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Show Project | Tomislav Dukez (tomdu3)</title>
  <link href="style.css" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
</head>

<body>
  <header class="controls-bar">
    <div class="control-group">
      <label for="episode-selector" class="visually-hidden">Jump to episode</label>
      <select name="" id="episode-selector">
        <option value="">All episodes or Select...</option>
      </select>
    </div>

    <div class="control-group">
      <label for="search-input" class="visually-hidden">Search</label>
      <div class="search-container">
        <input type="text" placeholder="Search for an episode..." id="search-input">
        <button type="button" id="clear-search-btn" class="clear-btn" aria-label="Clear search">&times;</button>
      </div>
    </div>

    <p id="episode-count"></p>
  </header>

  <template id="episode-card">
    <section class="episode card">
      <h3>Episode title - code</h3>
      <img class="episode img" src="">
      <p class="episode summary">Episode Summary</p>
    </section>
  </template>
  <main id="root" class="cards-container">

  </main>
  <footer>&copy; Tomislav Dukez 2026&nbsp;| Data taken from&nbsp;<a href="https://tvmaze.com/" target="_blank">TVMaze.com</a>
  </footer>
  <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
  <script src="episodes.js"></script>

  <!-- Loads YOUR javascript code -->
  <script src="script.js"></script>
</body>

</html>
