<body>
  <header class="controls-bar">
    <label>
      Search <input type="text" id="search-input">
    </label>
    <p id="episode-count"></p>

    <!-- episode selector -->
    <label>
      Jump to episode
      <select name="" id="episode-selector">
        <option value=""> Select an episode </option>
      </select>
    </label>
  </header>

  <template id="episode-card">
    <section class="episode card">
      <h3>Episode title - code</h3>
      <img class="episode img" src="">
      <p class="episode summary">Episode Summary</p>
    </section>
  </template>
  <div id="root">

  </div>
